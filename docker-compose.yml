services:

  frontend:
    build:
      context: ./app/frontend
    container_name: group4-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./app/backend
    container_name: group4-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: group4db
      DB_USER: group4admin
      DB_PASSWORD: group4password
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: group4-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: group4db
      POSTGRES_USER: group4admin
      POSTGRES_PASSWORD: group4password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U group4admin -d group4db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: