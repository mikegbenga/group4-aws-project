<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Group 4 AWS Project</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
            background: #f5f7fa;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #232f3e;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: #ff9900;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #ec8b00;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            background: #f1f3f5;
            border-radius: 6px;
            text-align: left;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Group 4 AWS Cloud Project</h1>

    <p>
        Three-Tier Application using AWS, Docker Compose,
        Terraform and CI/CD.
    </p>

    <button onclick="checkBackend()">
        Check Backend
    </button>

    <div id="result">
        Backend status will appear here.
    </div>

</div>

<script>

async function checkBackend() {

    const result = document.getElementById("result");

    result.textContent = "Checking backend...";

    try {

        const response = await fetch("/api/health");

        const data = await response.json();

        result.textContent =
            JSON.stringify(data, null, 2);

    } catch (error) {

        result.textContent =
            "Unable to connect to backend.\n\n" + error;

    }

}

</script>

</body>
</html>
